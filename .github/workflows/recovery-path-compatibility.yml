name: Recovery inventory path compatibility
on:
  push:
    branches: [recovery/wici-database-20261107]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      NODE_ENV: test
      LIVE_ROUTING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Deliberately retain the locked source checks. No manifest/SQL regeneration
      # or expected-failure masking is allowed in this cross-platform check.
      - run: npm test -- --runInBand --forceExit --verbose --json --outputFile=focused-test-results.json databaseReleaseGovernance.test.js wiciRecoveryProfiles.test.js runtimeDatabaseIdentity.test.js prepareRuntimeIdentity.test.js databaseReleaseVisibility.test.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: focused-results-${{ matrix.os }}
          path: focused-test-results.json
          if-no-files-found: error
