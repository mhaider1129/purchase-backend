name: Recovery release verification
on:
  push:
    branches: [recovery/wici-database-20261107]
  pull_request:
    branches: [recovery/wici-database-20261107]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      NODE_ENV: test
      LIVE_ROUTING_ENABLED: 'false'
      DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:1/p2p_disposable_unit
      SUPABASE_URL: http://127.0.0.1:1
      SUPABASE_SERVICE_ROLE_KEY: fixture-not-a-production-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Deliberately retain the locked source checks. No manifest/SQL regeneration
      # or expected-failure masking is allowed in this cross-platform check.
      - run: npm test -- --runInBand --forceExit --verbose --json --outputFile=focused-test-results.json databaseReleaseGovernance.test.js wiciRecoveryProfiles.test.js runtimeDatabaseIdentity.test.js prepareRuntimeIdentity.test.js databaseReleaseVisibility.test.js databaseReleaseRoutines.test.js databaseReleaseVersions.test.js isolatedReleaseDiagnostic.test.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: focused-results-${{ matrix.os }}
          path: focused-test-results.json
          if-no-files-found: error

  routine-catalog:
    strategy:
      fail-fast: false
      matrix:
        major: [16, 17]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/testReleaseRoutineCatalog.js --major ${{ matrix.major }}
  backend-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: test
      LIVE_ROUTING_ENABLED: 'false'
      DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:1/p2p_disposable_unit
      SUPABASE_URL: http://127.0.0.1:1
      SUPABASE_SERVICE_ROLE_KEY: fixture-not-a-production-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test -- --runInBand --forceExit --json --outputFile=backend-test-results.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: full-backend-results
          path: backend-test-results.json
          if-no-files-found: error
